# /etc/nginx/sites-available/ukbangla  ->  symlink into sites-enabled
# Serves the static Next.js export and proxies the API/admin to gunicorn.
# Put Cloudflare (free plan) in front for TLS, caching and DDoS protection,
# or run certbot for Let's Encrypt directly.

upstream ukbangla_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name ukbanglaguardian.com www.ukbanglaguardian.com;

    client_max_body_size 25m;

    # --- Django app: API + Wagtail admin ---
    location ~ ^/(api|admin|django-admin)/ {
        proxy_pass         http://ukbangla_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Django collected static + uploaded media (served from disk) ---
    location /static/ {
        alias /srv/ukbangla/backend/static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /srv/ukbangla/backend/media/;
        expires 30d;
        access_log off;
    }

    # --- Static Next.js export ---
    root /var/www/ukbangla;
    index index.html;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }
}
