# /etc/nginx/sites-available/ukbangla  ->  symlink into sites-enabled
# Cloudflare (Full strict) terminates TLS at the edge and re-encrypts to this
# origin using the Cloudflare Origin Certificate below.
#
#   /api/, /admin/, /django-admin/, /static/, /media/   -> Django (gunicorn :8000)
#   everything else                                      -> Next.js (:3000)

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ukbanglaguardian.com www.ukbanglaguardian.com;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # --- Django app: API + Wagtail admin ---
    location ~ ^/(api|admin|django-admin)/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Django collected static + uploaded media (served from disk) ---
    location /static/ {
        alias /srv/ukbangla/backend/static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /srv/ukbangla/backend/media/;
        expires 30d;
        access_log off;
    }

    # --- Everything else: the Next.js server ---
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
